services:
  postgres:
    image: postgres:16-alpine
    container_name: financeflow-db
    environment:
      POSTGRES_USER: financeflow_user
      POSTGRES_PASSWORD: financeflow_password
      POSTGRES_DB: financeflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeflow_user -d financeflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeflow-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://financeflow_user:financeflow_password@postgres:5432/financeflow?schema=public
      JWT_SECRET: dev_jwt_secret_key_change_in_production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run start:prod"

volumes:
  postgres_data:

networks:
  default:
    name: financeflow
