name: financeflow
description: FinanceFlow - Personal Finance Management App. Track. Save. Grow.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Routing
  go_router: ^13.0.0

  # HTTP
  dio: ^5.4.0

  # Local Database
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.66.0

  # JSON Serialization
  json_annotation: ^4.8.0

  # UI & Theme
  google_fonts: ^6.1.0
  intl: ^0.19.0

  # Local Storage & Preferences
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Date & Time
  timeago: ^3.6.0

  # Image Handling
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0

  # Utility
  uuid: ^4.0.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  get_it: ^7.6.0

  # Logging
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  riverpod_lint: ^2.3.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.0

  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
